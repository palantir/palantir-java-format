type: improvement
improvement:
  description: |-
    Format Java 22-25 language features that previously crashed the formatter:

    * module import declarations (JEP 511) - `expected token: 'module'; generated java instead`,
      and `class com.sun.tools.javac.tree.JCTree$JCModuleImport cannot be cast to class
      com.sun.tools.javac.tree.JCTree$JCImport` from `--fix-imports-only`
    * compact source files and instance main methods (JEP 512) - `expected token: 'void'`
    * unnamed patterns in record deconstruction (JEP 456) - `expected token: '_'; generated , instead`

    Module imports sort between static and non-static imports, matching google-java-format.
  links:
  - https://github.com/palantir/palantir-java-format/pull/1707
