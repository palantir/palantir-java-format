apply plugin: 'application'
apply plugin: 'com.palantir.external-publish-jar'

application.mainClass = 'com.palantir.javaformat.java.Main'

description = 'Palantir Java Format'

dependencies {
    api project(':palantir-java-format-spi')
    api 'com.google.guava:guava'
    implementation 'org.functionaljava:functionaljava'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
    implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names'

    testImplementation 'com.google.guava:guava-testlib'
    testImplementation 'com.google.testing.compile:compile-testing'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.junit.jupiter:junit-jupiter-migrationsupport'
    testImplementation 'org.junit.jupiter:junit-jupiter'

    compileOnly 'com.google.auto.service:auto-service'
    annotationProcessor 'com.google.auto.service:auto-service'
    compileOnly "org.immutables:value::annotations"
    annotationProcessor "org.immutables:value"

    compileOnly 'org.derive4j:derive4j-annotation'
    annotationProcessor 'org.derive4j:derive4j'
    implementation 'com.google.code.findbugs:jsr305'
}

moduleJvmArgs {
    exports().addAll(
            'jdk.compiler/com.sun.tools.javac.file',
            'jdk.compiler/com.sun.tools.javac.main',
            'jdk.compiler/com.sun.tools.javac.parser',
            'jdk.compiler/com.sun.tools.javac.tree',
            'jdk.compiler/com.sun.tools.javac.util',
            'jdk.compiler/com.sun.tools.javac.code',
            'jdk.compiler/com.sun.tools.javac.api')
}

tasks.withType(JavaCompile).named('compileJava') {
    // By setting the source and target compatibility to 11, while still using a higher level
    // JDK for compilation, we can compile against the AST classes we need to support >11 source
    // features but still run on 11 JDKs (with the addition of checking the java version at runtime
    // and dynamically loading the correct formatter implementation)
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// false positives due to org.junit.runners.* in the test cases
tasks.named("checkJUnitDependencies") {
    enabled = false
}

tasks.named("test") {
    // Run all classes and tests in parallel
    // https://junit.org/junit5/docs/current/user-guide/#writing-tests-parallel-execution
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
}

javaVersion {
    target = 21
}

// The default `test` task runs on JDK 21 (see the root `javaVersions.runtime`) and covers every
// golden test except ModuleImport, which needs a parser that produces module import declarations
// (JDK 23+, preview). Re-run the file-based suites on 23 and 25: 23 parses module imports as
// preview, 25 as a final feature.
[23, 25].each { jdkVersion ->
    tasks.register("testJdk${jdkVersion}", Test) {
        group = 'verification'
        description = "Runs the JDK-version-gated golden test suites on JDK ${jdkVersion}."

        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(jdkVersion)
        }

        doFirst {
            // Belt and braces for FormatterVersionTest, which cannot catch a typo in the property name.
            int resolved = javaLauncher.get().metadata.languageVersion.asInt()
            if (resolved != jdkVersion) {
                throw new GradleException("testJdk${jdkVersion} resolved to JDK ${resolved}")
            }
        }

        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        systemProperty 'recreate', System.getProperty('recreate', 'false')
        // Asserted by FormatterVersionTest, so a leg that resolves to an older JDK fails instead
        // of silently skipping the ModuleImport golden and the module import tests.
        systemProperty 'expectedJavaVersion', jdkVersion

        filter {
            includeTestsMatching 'com.palantir.javaformat.java.FormatterIntegrationTest'
            includeTestsMatching 'com.palantir.javaformat.java.StringWrapperIntegrationTest'
            includeTestsMatching 'com.palantir.javaformat.java.FormatterVersionTest'
            // Covers the JCModuleImport ClassCastException fix, which the JDK 21 default `test`
            // skips and the integration suites never reach (they don't call removeUnusedImports).
            includeTestsMatching 'com.palantir.javaformat.java.RemoveUnusedImportsTest'
            // Covers module imports through formatSourceAndFixImports, the entry point Spotless uses.
            includeTestsMatching 'com.palantir.javaformat.java.ModuleImportTest'
            // Carry the module-import ordering rows. ImportOrderer only lexes, so JDK 21 covers them
            // too, but this is where a new module-import ordering test would land.
            includeTestsMatching 'com.palantir.javaformat.java.GoogleImportStyleTest'
            includeTestsMatching 'com.palantir.javaformat.java.AospImportStyleTest'
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('testJdk23'), tasks.named('testJdk25')
}
